<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学 · 每日推理档案</title><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}}</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><style>body{margin:0;background:#f5f6f3;color:#24332f;font:16px/1.65 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px 18px}a{color:#176458}header{padding-bottom:12px}h1{font-size:28px}h2{font-size:20px}article{background:#fff;border:1px solid #dce4df;border-radius:10px;margin:14px 0;padding:16px}article h3{margin:0 0 8px;font-size:18px}.line{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid #edf0ee}.line>strong{color:#176458;font-size:14px}.line>div{min-width:0;overflow-x:auto}p{margin:4px 0}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bdcbc5;border-radius:8px;font:inherit;background:white}nav{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}small{color:#64756e}@media(max-width:480px){.line{grid-template-columns:1fr;gap:3px}article{padding:12px}h1{font-size:24px}}</style></head><body><main><header><a href="../">← 复习档案首页</a><h1>数学 · 每日推理档案</h1><small>问题 / 求解 / 注意事项 / 几句话总结</small></header><input id="search" placeholder="搜索日期、问题或知识点" aria-label="搜索笔记"><nav id="dates"></nav><div id="notes">正在读取笔记…</div></main><script>const el=document.getElementById('notes'),q=document.getElementById('search');let days=[];function render(){const key=q.value.trim().toLowerCase();el.replaceChildren();document.getElementById('dates').replaceChildren();for(const day of days){const entries=day.entries.filter(e=>JSON.stringify([day.date,e]).toLowerCase().includes(key));if(!entries.length)continue;const section=document.createElement('section');section.id='d'+day.date;const h=document.createElement('h2');h.textContent=day.date+' · '+day.subject;section.append(h);const link=document.createElement('a');link.href='#'+section.id;link.textContent=day.date;document.getElementById('dates').append(link);for(const e of entries){const a=document.createElement('article');for(const [label,content] of [['问题',e.question],['求解',e.solution],['注意事项',e.notes],['几句话总结',e.summary]]){const r=document.createElement('div');r.className='line';const b=document.createElement('strong');b.textContent=label;const c=document.createElement('div');for(const s of Array.isArray(content)?content:[content]){const p=document.createElement('p');p.textContent=s;c.append(p)}r.append(b,c);a.append(r)}section.append(a)}el.append(section)}if(!el.children.length)el.textContent='没有匹配的笔记';if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([el]).catch(console.error)}q.addEventListener('input',render);fetch('./data/notes.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{days=x.sort((a,b)=>b.date.localeCompare(a.date));render()}).catch(()=>el.textContent='笔记加载失败，请刷新重试。');</script></body></html>
