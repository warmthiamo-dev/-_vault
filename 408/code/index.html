<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>408 算法代码本</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f3;color:#24332f;font:16px system-ui}header{padding:16px 20px;border-bottom:1px solid #dce4df;background:white}a{color:#17584e}main{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;padding:14px;max-width:1400px;margin:auto}aside,section{background:white;border:1px solid #dce4df;border-radius:12px;padding:14px;min-width:0}button,input,select{font:inherit;padding:10px;border:1px solid #cbd5d0;border-radius:8px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#17584e;color:white}input{min-width:0;width:100%}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.files button{display:block;width:100%;text-align:left;margin:6px 0;overflow-wrap:anywhere}.files .active{background:#e1eee9;border-color:#17584e}textarea{display:block;width:100%;min-height:55vh;resize:vertical;background:#182321;color:#e5eee9;border:0;border-radius:8px;padding:16px;font:16px/1.65 ui-monospace,Menlo,monospace;tab-size:4;white-space:pre;overflow:auto}small{color:#60716a}h1{font-size:23px;margin:8px 0}#status{min-height:22px;margin:8px 0}@media(max-width:650px){main{grid-template-columns:1fr}aside{max-height:240px;overflow:auto}textarea{min-height:55vh}}</style><link rel="stylesheet" href="../assets/code-highlight.css"><script defer src="../assets/code-highlight.js"></script><header><a href="../../">复习首页</a><h1>408 算法代码本</h1><small>只编写与保存，不编译、不运行。</small></header><main><aside><button id="new" class="primary">＋ 新建代码</button><div class="bar"><button id="backup">导出备份</button><button id="restore">导入</button><input type="file" id="upload" accept=".json" hidden></div><input id="search" placeholder="搜索文件"><div class="files" id="files"></div></aside><section><input id="name" placeholder="算法名称"><div class="bar"><select id="category"><option>线性表</option><option>栈和队列</option><option>树与二叉树</option><option>图</option><option>查找</option><option>排序</option><option>历年真题</option><option>其他</option></select><button id="save" class="primary">保存</button><button id="indent">缩进</button><button id="download">导出 .c</button><button id="remove">删除</button></div><textarea id="code" aria-label="C 语言代码编辑器" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" wrap="off"></textarea><div id="status" role="status"></div><small>代码保存在当前浏览器中，不会上传 GitHub；清理网站数据可能丢失，请定期导出备份。</small></section></main><script>
const $=id=>document.getElementById(id),key='vault.algorithm.v1';let docs=[],active=null,ready=true;try{docs=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(docs))throw Error()}catch(e){ready=false;$('status').textContent='读取存储失败，请勿覆盖原数据。'}
const current=()=>docs.find(d=>d.id===active);
function persist(){if(!ready)return false;try{localStorage.setItem(key,JSON.stringify(docs));$('status').textContent='已保存 · '+new Date().toLocaleTimeString();return true}catch(e){$('status').textContent='保存失败，请立即导出备份。';return false}}
function list(){let q=$('search').value.toLowerCase();$('files').replaceChildren();docs.filter(d=>(d.name+' '+d.category).toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated).forEach(d=>{let b=document.createElement('button');b.textContent=d.category+' / '+d.name;b.className=d.id===active?'active':'';b.onclick=()=>open(d.id);$('files').append(b)})}
function open(id){active=id;let d=current();if(!d)return;$('name').value=d.name;$('category').value=d.category;$('code').value=d.code;list()}
function add(){if(!ready)return;let d={id:crypto.randomUUID(),name:'未命名算法',category:'线性表',code:'',updated:Date.now()};docs.push(d);open(d.id);persist();$('name').focus()}
function save(){let d=current();if(!d||!ready)return;Object.assign(d,{name:$('name').value||'未命名算法',category:$('category').value,code:$('code').value,updated:Date.now()});persist();list()}
function indent(){let e=$('code');e.setRangeText('    ',e.selectionStart,e.selectionEnd,'end');e.focus();save()}
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('new').onclick=add;$('save').onclick=save;$('search').oninput=list;$('indent').onclick=indent;['name','category','code'].forEach(id=>$(id).addEventListener('input',save));$('code').addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();indent()}});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save()}});
$('download').onclick=()=>{let d=current();if(d)download(d.name.replace(/[\\/]/g,'_')+'.c',d.code,'text/plain')};$('backup').onclick=()=>download('408-algorithms.json',JSON.stringify(docs,null,2),'application/json');$('restore').onclick=()=>$('upload').click();$('upload').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||!a.every(d=>typeof d.name==='string'&&typeof d.code==='string'&&typeof d.category==='string'))throw Error();if(!ready)throw Error();for(let d of a)docs.push({id:crypto.randomUUID(),name:d.name,code:d.code,category:d.category,updated:Date.now()});persist();if(docs.length)open(docs.at(-1).id)}catch(e){alert('导入失败，请检查备份文件')}finally{$('upload').value=''}};$('remove').onclick=()=>{let d=current();if(d&&confirm('删除 '+d.name+'？')){docs=docs.filter(x=>x.id!==active);if(docs.length)open(docs[0].id);else add();persist();list()}};if(docs.length)open(docs.sort((a,b)=>b.updated-a.updated)[0].id);else if(ready)add();
</script></html>
